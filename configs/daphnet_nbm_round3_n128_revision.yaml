experiment:
  name: daphnet_nbm_round3_n128_revision
  dataset: Daphnet Freezing of Gait
  subjects: [S01, S02, S03, S05, S06, S07, S08, S09]
  stable_cohort: [S01, S02, S05, S06, S07, S08, S09]
  seeds: [20260802, 20260803, 20260804]

frozen_training:
  preprocessor: P0_current
  architecture: M3_tcdae_long
  input_shape: [batch, 128, 9]
  loss: MSE
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 2000
  patience: 100
  gradient_clip_norm: 1.0
  augmentation: false
  evaluation_set_equals_training_set: true

window_selection:
  standard_sample_count: 128
  fine_capacity_levels: [1, 2, 4, 8, 16, 32, 64, 128]
  fine_capacity_subject: S03
  fine_capacity_seed: 20260802
  energy_measure: median_channel_rms
  energy_quartile_count: 4
  windows_per_quartile_at_n128: 32
  nested_prefixes: true
  duplicate_windows: false
  overlap_policy: prefer_non_overlap_and_temporal_spread_with_documented_relaxation
  fog_guard_seconds_each_side: 1.0

n128_strict_gate:
  minimum_improvement_percent: 40
  minimum_pearson: 0.60
  maximum_nrmse: 0.75
  amplitude_ratio: [0.65, 1.35]
  minimum_raw_latent_distance_correlation: 0.40

stable_cohort_gate:
  minimum_passes: 20
  total_runs: 21
  minimum_subjects_with_three_of_three_passes: 6
  stable_subject_zero_of_three_allowed: false
  maximum_failed_subjects_all_cohorts: 2
  aggregate_medians_must_pass_n128_gate: true

tail_metrics:
  - nrmse_p90
  - nrmse_p95
  - pearson_p10
  - amplitude_ratio_p10
  - amplitude_ratio_p90
  - negative_improvement_window_fraction
  - nrmse_gt_1_window_fraction
  - pearson_lt_0_2_window_fraction

interpretation_boundary: >-
  Training-set memory and capacity diagnostic only; not evidence of
  independent-record generalization, denoising effectiveness, or FoG detection.
