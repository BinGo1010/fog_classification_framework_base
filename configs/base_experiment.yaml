# Unified experiment template.
# This file keeps the common command-line style parameters in YAML form.
# For FOG classification, pred_len/features/dec_in/c_out are stored for
# compatibility with forecasting-style experiments and future window studies.

project:
  task_name: fog_classification
  is_training: 1
  model_id: fog_cnn1d_win120
  name: fog_cnn1d_win120
  output_dir: outputs/fog_cnn1d_win120
  seed: 42
  device: auto

experiment:
  mode: ordinary       # ordinary | loso | supcon | simclr | profile
  loso_root: data/fogstar_loso

data:
  name: ChannelSubsetNPZDataset
  data: FOG
  root: data/fogstar_npz
  data_path: train.npz
  train_file: train.npz
  val_file: val.npz
  test_file: test.npz
  x_key: X
  y_key: y
  input_format: NCT
  normalize: zscore
  features: M          # M | S | MS; retained for forecasting-style compatibility
  batch_size: 128
  num_workers: 0
  pin_memory: true
  imu_positions: [ankleL, ankleR, back, wrist]
  metadata_keys: [subjectID, sessionID, taskID, activity, fog_severity, fog_fraction, clinical]
  windowing:
    enabled: true
    sensor_csv: data/sensor_data.csv
    clinical_csv: data/clinical_data.csv
    cache_root: data/generated
    out_dir: data/fogstar_npz
    split_strategy: subject     # subject | random_window | loso
    window_size: 120
    stride: 60
    fog_threshold: 0.25
    keep_activity_zero: false
    val_size: 0.15
    test_size: 0.15
    seed: 42
    sampling_rate_hz: 60
    sync_model_seq_len: true
    force: false

model:
  name: CNN1D          # CNN1D | TransformerClassifier | IMUTransformer | MobileOne1DTiny
  in_channels: 24      # --enc_in
  dec_in: 24
  c_out: 2
  num_classes: 2
  seq_len: 120
  pred_len: 0
  hidden_dim: 128
  d_model: 128
  nhead: 4             # --n_heads
  num_layers: 3        # --e_layers
  d_layers: 1
  dim_feedforward: 512 # --d_ff
  dropout: 0.2

train:
  epochs: 80
  optimizer: AdamW
  optimizer_foreach: false
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine    # none | cosine | step | type1
  step_size: 10
  gamma: 0.5
  class_weight: auto
  loss: weighted_ce    # ce | weighted_ce | focal
  grad_clip: 1.0
  amp: true
  distributed: auto     # auto | true | false; true requires torchrun
  distributed_backend:  # auto-selects nccl on CUDA, gloo on CPU
  ddp_find_unused_parameters: auto
  early_stopping_patience: 15
  monitor: val_f1_macro
  monitor_mode: max
  save_best_checkpoint: true
  save_last_checkpoint: false
  checkpoint_include_optimizer: false
  checkpoint_include_scheduler: false

metrics:
  top_k: [1, 2]
  positive_class: 1
  average_methods: [macro, micro, weighted]
  save_predictions: true
  save_confusion_matrix: true
  save_per_class: true

augmentations:
  gaussian_noise_std: 0.03
  gaussian_noise_prob: 1.0
  scale_range: [0.9, 1.1]
  scale_prob: 1.0
  time_mask_ratio: 0.08
  time_mask_prob: 0.8
  time_mask_value: 0.0

supcon:
  pretrain_epochs: 20
  pretrain_lr: 0.001
  temperature: 0.1
  weight_decay: 0.0001
  finetune_encoder: true

simclr:
  pretrain_epochs: 20
  pretrain_lr: 0.001
  temperature: 0.1
  weight_decay: 0.0001
  finetune_encoder: true

# Example window-length ablation. Run a single entry with:
# python run.py --config configs/base_experiment.yaml --run_name cnn1d_win120
runs:
  - name: cnn1d_win120
    project:
      name: cnn1d_win120
      model_id: cnn1d_win120
      output_dir: outputs/cnn1d_win120
    model:
      name: CNN1D
      seq_len: 120

  - name: cnn1d_win60
    project:
      name: cnn1d_win60
      model_id: cnn1d_win60
      output_dir: outputs/cnn1d_win60
    data:
      windowing:
        out_dir:
        split_strategy: subject
        window_size: 60
        stride: 30
    model:
      name: CNN1D
      seq_len: 60

  - name: cnn1d_win240
    project:
      name: cnn1d_win240
      model_id: cnn1d_win240
      output_dir: outputs/cnn1d_win240
    data:
      windowing:
        out_dir:
        split_strategy: subject
        window_size: 240
        stride: 120
    model:
      name: CNN1D
      seq_len: 240

  - name: transformer_win120
    project:
      name: transformer_win120
      model_id: transformer_win120
      output_dir: outputs/transformer_win120
    model:
      name: TransformerClassifier
      seq_len: 120
      hidden_dim: 128
      d_model: 128
      nhead: 4
      num_layers: 3
      dim_feedforward: 512

  - name: cnn1d_random_window_win120
    project:
      name: cnn1d_random_window_win120
      model_id: cnn1d_random_window_win120
      output_dir: outputs/cnn1d_random_window_win120
    experiment:
      mode: ordinary
    data:
      root: data/fogstar_random_window
      windowing:
        out_dir: data/fogstar_random_window
        split_strategy: random_window
        window_size: 120
        stride: 60
    model:
      name: CNN1D
      seq_len: 120

  - name: cnn1d_loso_win120
    project:
      name: cnn1d_loso_win120
      model_id: cnn1d_loso_win120
      output_dir: outputs/cnn1d_loso_win120
    experiment:
      mode: loso
      loso_root: data/fogstar_loso
    data:
      root: data/fogstar_loso
      windowing:
        out_dir: data/fogstar_loso
        split_strategy: loso
        window_size: 120
        stride: 60

  - name: cnn1d_supcon_win120
    project:
      name: cnn1d_supcon_win120
      model_id: cnn1d_supcon_win120
      output_dir: outputs/cnn1d_supcon_win120
    experiment:
      mode: supcon
    model:
      name: SupConCNN1D
      seq_len: 120

  - name: cnn1d_simclr_win120
    project:
      name: cnn1d_simclr_win120
      model_id: cnn1d_simclr_win120
      output_dir: outputs/cnn1d_simclr_win120
    experiment:
      mode: simclr
    model:
      name: SimCLRCNN1D
      seq_len: 120
