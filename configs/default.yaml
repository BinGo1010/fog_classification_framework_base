project:
  task_name: fog_classification
  is_training: 1
  model_id: smoke_cnn1d
  name: smoke_cnn1d
  output_dir: outputs/smoke_cnn1d
  seed: 42
  device: auto

experiment:
  mode: ordinary

data:
  name: NPZTimeSeriesDataset
  data: FOG
  root: data/dummy
  data_path: train.npz
  train_file: train.npz
  val_file: val.npz
  test_file: test.npz
  x_key: X
  y_key: y
  input_format: NCT
  normalize: zscore
  features: M
  batch_size: 64
  num_workers: 0
  pin_memory: true

model:
  name: CNN1D
  in_channels: 6
  dec_in: 6
  c_out: 2
  num_classes: 2
  seq_len: 128
  pred_len: 0
  hidden_dim: 128
  d_model: 128
  nhead: 4
  num_layers: 3
  d_layers: 1
  dim_feedforward: 512
  dropout: 0.2

train:
  epochs: 30
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  class_weight: auto
  loss: weighted_ce
  grad_clip: 1.0
  amp: false
  distributed: auto
  distributed_backend:
  ddp_find_unused_parameters: auto
  early_stopping_patience: 10
  monitor: val_f1_macro
  monitor_mode: max

metrics:
  top_k: [1, 2]
  positive_class: 1
  average_methods: [macro, micro, weighted]
  save_predictions: true
  save_confusion_matrix: true
  save_per_class: true
