experiment: daphnet_full_subject_nbm_residual_inceptiontime_v1
source_experiment: daphnet_full_subject_nbm_residual_binary_v1
subjects: [S01, S02, S03, S05, S06, S07, S08, S09]
sampling_rate_hz: 64
window_samples: 128
stride_samples: 64
representation_cache:
  reuse_frozen_outer_splits: true
  reuse_nbm_oof_reconstructions: true
  retrain_nbm: false
  source: outputs/daphnet_full_subject_nbm_residual_binary_v1/full_subject_binary_experiment
classifier:
  architecture: inceptiontime_6module
  input_layout: [batch, channel, time]
  modules: 6
  residual_after_modules: [3, 6]
  bottleneck_channels: 32
  branch_channels: 32
  kernel_sizes: [9, 19, 39]
  pooling_branch: MaxPool1d(3, stride=1) then Conv1d(1)
  module_output: BatchNorm1d then ReLU
  final_pooling: global_average
  output: one logit with sigmoid probability
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 128
  maximum_epochs: 50
  patience: 8
  gradient_clip_norm: 1.0
  seeds: [20260802, 20260803, 20260804]
parallel_execution:
  recommended_devices: [cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6]
  process_model: one_process_per_gpu
  fold_assignment: greedy_lpt_by_outer_train_windows
  cpu_threads_per_worker: 2
  worker_retries: 2
resume:
  completed_run_skip_requires: [run_metrics.json, test_predictions.csv]
  incomplete_run_checkpoint: inceptiontime_resume.pt
  checkpoint_every_epochs: 1
  restored_state: [model, optimizer, best_model, early_stopping, dataloader_shuffle]
  atomic_checkpoint_replace: true
methods:
  B0: {name: Raw-InceptionTime, channels: 9}
  B1: {name: R-InceptionTime, channels: 9}
  B2: {name: R5-InceptionTime, channels: 27}
  B3: {name: Raw+R5-InceptionTime, channels: 36}
statistics:
  unit: subject
  bootstrap_samples: 10000
  bootstrap_seed: 20260804
  paired_test: Wilcoxon signed-rank
  multiplicity: Holm
leakage_policy:
  frozen_outer_splits: true
  outer_test_used_for_scaler: false
  outer_test_used_for_nbm_training: false
  outer_test_used_for_early_stopping: false
  outer_test_used_for_threshold: false
  classifier_training_residuals_are_oof: true
