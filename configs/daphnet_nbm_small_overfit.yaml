experiment:
  name: daphnet_nbm_small_overfit
  purpose: diagnostic memorization of small clean Non-FoG subsets
  subjects: [S01, S02, S03, S05, S06, S07, S08, S09]
  sample_counts: [1, 8, 32]
  optional_sample_count: 128

data:
  sampling_rate_hz: 64
  channels: 9
  window_samples: 128
  stride_samples: 64
  fog_guard_samples_each_side: 64
  source_pool: frozen within-subject training split
  scaler: per-run channel RobustScaler fitted on unique selected raw points
  preprocessing: robust scale then subtract each window/channel temporal mean

model:
  architecture: GRU encoder -> bottleneck -> zero-input GRU decoder
  encoder_hidden: 64
  bottleneck_dim: 32
  decoder_hidden: 64
  dropout: 0.0

training:
  optimizer: Adam
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: min(sample_count, 32)
  max_epochs: 2000
  early_stopping: false
  gradient_clip_norm: 1.0
  shuffle: true
  augmentation: false
  loss: SmoothL1Loss(beta=1.0)

seed:
  primary: 20260802
  failed_level_1_or_8_review: [20260802, 20260803, 20260804]
