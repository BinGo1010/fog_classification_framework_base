experiment: daphnet_resnet8_avgpool8_b1_inceptiontime_pilot_v1
subjects: [S01, S02, S03, S05, S06, S07, S08, S09]
sampling_rate_hz: 64
window_samples: 128
stride_samples: 64
seed: 20260802
outer_protocol:
  multi_record: leave one complete valid record out
  single_record: five chronological blocks with five-second purge
inner_protocol:
  folds: 3
  record_first: true
  time_block_purge_seconds: 5
  classifier_training_residuals_must_be_oof: true
nbm:
  architecture: resnet8_style_avgpool8_mlp_nbm
  input_shape: [batch, 9, 128]
  encoder_feature_shape: [batch, 48, 32]
  encoder:
    stem: {channels: [9, 32], kernel: 7, stride: 2}
    block1: {channels: [32, 32], kernel: 3, stride: 1}
    block2: {channels: [32, 48], kernel: 3, stride: 2}
    block3: {channels: [48, 48], kernel: 5, stride: 1}
    normalization: GroupNorm
    activation: GELU
  pool: {type: AdaptiveAvgPool1d, output_size: 8}
  pooled_shape: [batch, 48, 8]
  embedding:
    flatten_dimension: 384
    output_dimension: 512
    normalization: LayerNorm
    activation: GELU
    dropout: 0.1
  decoder:
    expansion: [512, 1536]
    reshape: [batch, 48, 32]
    up_block1: {channels: [48, 32], output_samples: 64, kernel: 5}
    up_block2: {channels: [32, 24], output_samples: 128, kernel: 5}
    output_convolution: {channels: [24, 9], kernel: 1, activation: none}
    long_skip_connections: false
  training_data: strict clean Non-FoG only
  loss: L4
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 64
  maximum_epochs: 3000
  patience: 100
  resume_checkpoint_interval_epochs: 10
classifier:
  input: B1 signed OOF residual
  input_shape: [batch, 9, 128]
  architecture: InceptionTime-6module
  modules: 6
  residual_after_modules: [3, 6]
  kernel_sizes: [9, 19, 39]
  bottleneck_channels: 32
  branch_channels: 32
  final_pooling: global_average
  output: one logit
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 128
  maximum_epochs: 100
  patience: 15
  gradient_clip_norm: 1.0
leakage_policy:
  outer_test_used_for_scaler: false
  outer_test_used_for_nbm_training: false
  outer_test_used_for_early_stopping: false
  outer_test_used_for_threshold: false
  classifier_training_residuals_are_oof: true
