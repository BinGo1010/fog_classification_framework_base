<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="headerGradient2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#173B57"/>
      <stop offset="100%" stop-color="#2D6B85"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173B57" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 21px; fill: #D8EAF2; }
      .section { font-size: 28px; font-weight: 700; fill: #173B57; }
      .label { font-size: 21px; font-weight: 700; fill: #27495C; }
      .value { font-size: 18px; font-weight: 700; }
      .small { font-size: 17px; fill: #536C79; }
      .callout-title { font-size: 22px; font-weight: 700; }
      .callout { font-size: 19px; fill: #314F60; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#F7FAFC"/>
  <rect x="0" y="0" width="1800" height="116" fill="url(#headerGradient2)"/>
  <text class="font title" x="900" y="52" text-anchor="middle">主要结果：Raw 整体排序能力更强，Persistence 存在事件级取舍</text>
  <text class="font subtitle" x="900" y="88" text-anchor="middle">受试者宏平均 · 8 折 LOSO · 条形长度表示均值，均值±标准差见右侧标签</text>

  <!-- Legend -->
  <rect x="1290" y="145" width="26" height="26" rx="5" fill="#1976B8"/>
  <text class="font small" x="1328" y="165">Raw-support-matched</text>
  <rect x="1515" y="145" width="26" height="26" rx="5" fill="#D66A16"/>
  <text class="font small" x="1553" y="165">完整 Persistence</text>

  <!-- Main normalized metrics panel -->
  <rect x="70" y="190" width="1660" height="580" rx="24" fill="#FFFFFF" stroke="#B7CAD4" filter="url(#shadow2)"/>
  <text class="font section" x="115" y="235">A. 0–1 范围主要指标（越高越好）</text>

  <!-- Axis grid, x0=365, x1=1315 -->
  <line x1="365" y1="265" x2="365" y2="718" stroke="#AFC2CC" stroke-width="2"/>
  <line x1="602.5" y1="265" x2="602.5" y2="718" stroke="#E0E8EC"/>
  <line x1="840" y1="265" x2="840" y2="718" stroke="#E0E8EC"/>
  <line x1="1077.5" y1="265" x2="1077.5" y2="718" stroke="#E0E8EC"/>
  <line x1="1315" y1="265" x2="1315" y2="718" stroke="#AFC2CC" stroke-width="2"/>
  <text class="font small" x="365" y="748" text-anchor="middle">0</text>
  <text class="font small" x="602.5" y="748" text-anchor="middle">0.25</text>
  <text class="font small" x="840" y="748" text-anchor="middle">0.50</text>
  <text class="font small" x="1077.5" y="748" text-anchor="middle">0.75</text>
  <text class="font small" x="1315" y="748" text-anchor="middle">1.00</text>

  <!-- PR-AUC -->
  <text class="font label" x="330" y="314" text-anchor="end">PR-AUC</text>
  <rect x="365" y="282" width="585.2" height="25" rx="7" fill="#1976B8"/>
  <rect x="365" y="314" width="490.3" height="25" rx="7" fill="#D66A16"/>
  <text class="font value" x="967" y="302" fill="#12689F">0.6160 ± 0.1386</text>
  <text class="font value" x="872" y="334" fill="#B9560F">0.5161 ± 0.1259</text>

  <!-- BA -->
  <text class="font label" x="330" y="400" text-anchor="end">Balanced Accuracy</text>
  <rect x="365" y="368" width="763.2" height="25" rx="7" fill="#1976B8"/>
  <rect x="365" y="400" width="729.2" height="25" rx="7" fill="#D66A16"/>
  <text class="font value" x="1145" y="388" fill="#12689F">0.8034 ± 0.0698</text>
  <text class="font value" x="1111" y="420" fill="#B9560F">0.7676 ± 0.0910</text>

  <!-- AUROC -->
  <text class="font label" x="330" y="486" text-anchor="end">AUROC</text>
  <rect x="365" y="454" width="854.0" height="25" rx="7" fill="#1976B8"/>
  <rect x="365" y="486" width="812.9" height="25" rx="7" fill="#D66A16"/>
  <text class="font value" x="1236" y="474" fill="#12689F">0.8989 ± 0.0606</text>
  <text class="font value" x="1195" y="506" fill="#B9560F">0.8557 ± 0.0905</text>

  <!-- FoG F1 -->
  <text class="font label" x="330" y="572" text-anchor="end">FoG F1</text>
  <rect x="365" y="540" width="499.0" height="25" rx="7" fill="#1976B8"/>
  <rect x="365" y="572" width="464.8" height="25" rx="7" fill="#D66A16"/>
  <text class="font value" x="881" y="560" fill="#12689F">0.5253 ± 0.1637</text>
  <text class="font value" x="846" y="592" fill="#B9560F">0.4893 ± 0.1365</text>

  <!-- Event Sens -->
  <text class="font label" x="330" y="658" text-anchor="end">Event Sensitivity</text>
  <rect x="365" y="626" width="633.9" height="25" rx="7" fill="#1976B8"/>
  <rect x="365" y="658" width="714.1" height="25" rx="7" fill="#D66A16"/>
  <text class="font value" x="1016" y="646" fill="#12689F">0.6673 ± 0.2206</text>
  <text class="font value" x="1097" y="678" fill="#B9560F">0.7517 ± 0.1448</text>
  <rect x="1360" y="620" width="300" height="66" rx="14" fill="#FFF0E4" stroke="#E3A06E"/>
  <text class="font small" x="1510" y="647" text-anchor="middle" fill="#B9560F">此项 Persistence 更高</text>
  <text class="font small" x="1510" y="673" text-anchor="middle">但需结合 FA/h 与延迟解释</text>

  <!-- Deployment panel -->
  <rect x="70" y="800" width="840" height="260" rx="24" fill="#FFFFFF" stroke="#B7CAD4" filter="url(#shadow2)"/>
  <text class="font section" x="115" y="845">B. 误报与检测延迟（越低越好）</text>

  <text class="font label" x="120" y="913">FA/h</text>
  <rect x="270" y="880" width="404.3" height="28" rx="7" fill="#1976B8"/>
  <rect x="270" y="918" width="491.2" height="28" rx="7" fill="#D66A16"/>
  <text class="font value" x="690" y="902" fill="#12689F">74.12 ± 50.39</text>
  <text class="font value" x="777" y="940" fill="#B9560F">90.05 ± 71.92</text>

  <text class="font label" x="120" y="1001">Delay (s)</text>
  <rect x="270" y="968" width="179.2" height="28" rx="7" fill="#1976B8"/>
  <rect x="270" y="1006" width="449.9" height="28" rx="7" fill="#D66A16"/>
  <text class="font value" x="465" y="990" fill="#12689F">0.192 ± 0.278</text>
  <text class="font value" x="736" y="1028" fill="#B9560F">0.482 ± 0.664</text>

  <!-- Interpretation panel -->
  <rect x="940" y="800" width="790" height="260" rx="24" fill="#EAF3F7" stroke="#9BB6C4" filter="url(#shadow2)"/>
  <text class="font callout-title" x="985" y="848" fill="#173B57">最直接的消融证据</text>
  <text class="font callout" x="985" y="890">• Raw → x−μ：PR-AUC 下降 0.1091</text>
  <text class="font callout" x="1015" y="922">95% CI [−0.1625, −0.0565]，主要损失来自中心化</text>
  <text class="font callout" x="985" y="960">• 再除以 σ：PR-AUC 回升 0.0234，但 CI 跨 0</text>
  <text class="font callout" x="985" y="998">• 再 clip：PR-AUC 下降 0.0143，CI 同样跨 0</text>
  <text class="font callout-title" x="985" y="1038" fill="#1976B8">结论：当前 Persistence 残差不宜完全替代 Raw</text>
</svg>
