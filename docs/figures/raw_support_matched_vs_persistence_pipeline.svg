<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#173B57"/>
      <stop offset="100%" stop-color="#2D6B85"/>
    </linearGradient>
    <linearGradient id="rawGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF5FF"/>
      <stop offset="100%" stop-color="#D9ECFA"/>
    </linearGradient>
    <linearGradient id="persistenceGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E7"/>
      <stop offset="100%" stop-color="#FCE4CD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173B57" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#426477"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1976B8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D66A16"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 21px; fill: #D8EAF2; }
      .section { font-size: 29px; font-weight: 700; }
      .box-title { font-size: 23px; font-weight: 700; fill: #173B57; }
      .body { font-size: 20px; fill: #27495C; }
      .small { font-size: 17px; fill: #4A6573; }
      .formula { font-size: 22px; font-family: "Cambria Math", "Times New Roman", serif; fill: #183F56; }
      .tag { font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="#F7FAFC"/>
  <rect x="0" y="0" width="1800" height="116" fill="url(#headerGradient)"/>
  <text class="font title" x="900" y="52" text-anchor="middle">Raw-support-matched 与完整 Persistence：严格同支持方法对照</text>
  <text class="font subtitle" x="900" y="88" text-anchor="middle">Daphnet · 3 个 IMU / 9 通道 · 64 Hz · 8 折 LOSO · 4 秒 TCN-M 输入</text>

  <!-- Shared preprocessing -->
  <rect x="90" y="150" width="1620" height="190" rx="24" fill="#FFFFFF" stroke="#9BB6C4" stroke-width="2" filter="url(#shadow)"/>
  <text class="font box-title" x="130" y="192">两种方法完全共享的折内预处理与样本支持</text>

  <rect x="130" y="218" width="310" height="82" rx="14" fill="#EEF4F7" stroke="#B7CAD4"/>
  <text class="font body" x="285" y="250" text-anchor="middle">3 个 IMU × 3 轴</text>
  <text class="font small" x="285" y="278" text-anchor="middle">ankle / thigh / trunk，共 9 通道</text>

  <line x1="450" y1="259" x2="505" y2="259" stroke="#426477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="520" y="218" width="370" height="82" rx="14" fill="#EEF4F7" stroke="#B7CAD4"/>
  <text class="font body" x="705" y="248" text-anchor="middle">训练受试者 valid non-FoG</text>
  <text class="font small" x="705" y="278" text-anchor="middle">逐通道 median 与 IQR/1.349</text>

  <line x1="900" y1="259" x2="955" y2="259" stroke="#426477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="970" y="218" width="310" height="82" rx="14" fill="#EEF4F7" stroke="#B7CAD4"/>
  <text class="font body" x="1125" y="248" text-anchor="middle">Robust scaling</text>
  <text class="font formula" x="1125" y="278" text-anchor="middle">x̃ = clip((x−m)/s, −12, 12)</text>

  <line x1="1290" y1="259" x2="1345" y2="259" stroke="#426477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1360" y="218" width="310" height="82" rx="14" fill="#EEF4F7" stroke="#B7CAD4"/>
  <text class="font body" x="1515" y="248" text-anchor="middle">同一 HistoryPlan</text>
  <text class="font small" x="1515" y="278" text-anchor="middle">同 anchor、标签、8 个块 ID</text>

  <!-- split -->
  <line x1="900" y1="340" x2="900" y2="376" stroke="#426477" stroke-width="3"/>
  <line x1="460" y1="376" x2="1340" y2="376" stroke="#426477" stroke-width="3"/>
  <line x1="460" y1="376" x2="460" y2="410" stroke="#1976B8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="1340" y1="376" x2="1340" y2="410" stroke="#D66A16" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <!-- Raw branch -->
  <rect x="80" y="420" width="760" height="660" rx="28" fill="url(#rawGradient)" stroke="#1976B8" stroke-width="3" filter="url(#shadow)"/>
  <text class="font section" x="320" y="470" text-anchor="middle" fill="#12689F">A. Raw-support-matched</text>
  <rect x="575" y="438" width="220" height="40" rx="20" fill="#1976B8"/>
  <text class="font tag" x="685" y="465" text-anchor="middle" fill="#FFFFFF">不使用 μ、σ 或残差</text>

  <rect x="135" y="505" width="650" height="100" rx="16" fill="#FFFFFF" stroke="#83B9D9" stroke-width="2"/>
  <text class="font box-title" x="460" y="540" text-anchor="middle">每个 0.5 秒块直接保留 x̃</text>
  <text class="font formula" x="460" y="577" text-anchor="middle">qᵢᴿᵃʷ = x̃ᵢ ∈ ℝ⁹ˣ³²</text>

  <line x1="460" y1="606" x2="460" y2="646" stroke="#1976B8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="135" y="660" width="650" height="132" rx="16" fill="#FFFFFF" stroke="#83B9D9" stroke-width="2"/>
  <text class="font box-title" x="460" y="698" text-anchor="middle">8 个互不重叠的 0.5 秒 raw 块</text>
  <g transform="translate(185,721)">
    <rect x="0" y="0" width="65" height="35" rx="5" fill="#9DCEF0"/>
    <rect x="70" y="0" width="65" height="35" rx="5" fill="#87C2EA"/>
    <rect x="140" y="0" width="65" height="35" rx="5" fill="#73B6E3"/>
    <rect x="210" y="0" width="65" height="35" rx="5" fill="#5DA9DC"/>
    <rect x="280" y="0" width="65" height="35" rx="5" fill="#479BD4"/>
    <rect x="350" y="0" width="65" height="35" rx="5" fill="#338EC9"/>
    <rect x="420" y="0" width="65" height="35" rx="5" fill="#237FBC"/>
    <rect x="490" y="0" width="65" height="35" rx="5" fill="#1976B8"/>
  </g>
  <text class="font small" x="460" y="778" text-anchor="middle">连续 4 秒：Hᴿᵃʷ ∈ ℝ⁹ˣ²⁵⁶</text>

  <line x1="460" y1="793" x2="460" y2="833" stroke="#1976B8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="190" y="846" width="540" height="92" rx="18" fill="#1976B8"/>
  <text class="font box-title" x="460" y="883" text-anchor="middle" style="fill:#FFFFFF">TCN-M 二分类器</text>
  <text class="font small" x="460" y="914" text-anchor="middle" style="fill:#DCEFFA">RF=125 点，mean+max pooling，89,329 参数</text>

  <line x1="460" y1="940" x2="460" y2="974" stroke="#1976B8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="190" y="985" width="540" height="62" rx="18" fill="#FFFFFF" stroke="#1976B8" stroke-width="2"/>
  <text class="font body" x="460" y="1025" text-anchor="middle">FoG 概率 → 验证集选阈值 → FoG / non-FoG</text>

  <!-- Persistence branch -->
  <rect x="960" y="420" width="760" height="660" rx="28" fill="url(#persistenceGradient)" stroke="#D66A16" stroke-width="3" filter="url(#shadow)"/>
  <text class="font section" x="1195" y="470" text-anchor="middle" fill="#B9560F">B. 完整 Persistence</text>
  <rect x="1435" y="438" width="240" height="40" rx="20" fill="#D66A16"/>
  <text class="font tag" x="1555" y="465" text-anchor="middle" fill="#FFFFFF">正常模型仅学习 σ</text>

  <rect x="1015" y="505" width="650" height="126" rx="16" fill="#FFFFFF" stroke="#E4A26E" stroke-width="2"/>
  <text class="font box-title" x="1340" y="540" text-anchor="middle">2 秒 context + 0.5 秒 target</text>
  <text class="font formula" x="1340" y="575" text-anchor="middle">μ = repeat(context 最后 1 点, 32)</text>
  <text class="font small" x="1340" y="606" text-anchor="middle">μ 不训练；2 秒 context 的有效均值输入只有最后 1 点</text>

  <line x1="1340" y1="632" x2="1340" y2="663" stroke="#D66A16" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="1015" y="675" width="650" height="126" rx="16" fill="#FFFFFF" stroke="#E4A26E" stroke-width="2"/>
  <text class="font box-title" x="1340" y="710" text-anchor="middle">clean non-FoG 学习固定误差尺度 σ</text>
  <text class="font formula" x="1340" y="745" text-anchor="middle">L = mean[log σ + ½((x̃−μ)/σ)²]</text>
  <text class="font small" x="1340" y="778" text-anchor="middle">log σ ∈ ℝ¹ˣ⁹ˣ³²，共 288 个可学习参数；不随窗口变化</text>

  <line x1="1340" y1="802" x2="1340" y2="833" stroke="#D66A16" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="1015" y="846" width="650" height="92" rx="16" fill="#FFFFFF" stroke="#E4A26E" stroke-width="2"/>
  <text class="font box-title" x="1340" y="879" text-anchor="middle">构造标准化残差块</text>
  <text class="font formula" x="1340" y="916" text-anchor="middle">rᵢ = clip((x̃ᵢ−μᵢ)/σ, −12, 12) ∈ ℝ⁹ˣ³²</text>

  <line x1="1340" y1="940" x2="1340" y2="968" stroke="#D66A16" stroke-width="3" marker-end="url(#arrowOrange)"/>

  <rect x="1015" y="978" width="650" height="69" rx="18" fill="#D66A16"/>
  <text class="font body" x="1340" y="1006" text-anchor="middle" style="fill:#FFFFFF">8 块残差 → 4 秒 [9,256] → 同一 TCN-M</text>
  <text class="font small" x="1340" y="1034" text-anchor="middle" style="fill:#FFF1E7">FoG 概率 → 验证集选阈值 → FoG / non-FoG</text>

  <!-- Footer -->
  <rect x="90" y="1110" width="1620" height="72" rx="18" fill="#E9F0F4" stroke="#B1C5CF"/>
  <text class="font body" x="900" y="1141" text-anchor="middle">
    严格消融控制：相同 LOSO 划分、scaler、anchor、标签、4 秒支持、TCN-M、训练规则与阈值算法
  </text>
  <text class="font small" x="900" y="1169" text-anchor="middle">
    核心差异：Raw 保留完整 robust-scaled 波形；Persistence 用“最后一点常值预测”产生标准化残差，再完全替代 Raw
  </text>
</svg>
